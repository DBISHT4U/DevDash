[package]
name = "devdash"
version = "0.1.0"
edition = "2021"
authors = ["DBISHT4U <dbisht717@gmail.com>"]
description = "💻 A beautiful terminal dashboard for developers — system stats, Git info, project overview, and more in one gorgeous TUI."
license = "MIT"
readme = "README.md"
repository = "https://github.com/DBISHT4U/devdash"
keywords = ["terminal", "dashboard", "tui", "developer", "system"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.32"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "6.0"
whoami = "1.5"
battery = "0.7"

[profile.release]
opt-level = 3
lto = true
strip = true
